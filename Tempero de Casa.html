<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tempero de Casa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D kitchen; glass HUD pinned to the safe-area edges; menu as a bottom sheet over the live scene */
:root{
  --night:#0c1913;
  --glass:rgba(9,26,19,.82);
  --glass-soft:rgba(9,26,19,.6);
  --line:rgba(255,232,180,.16);
  --fg:#fbf6ea;
  --muted:#b7c7bb;
  --accent:#ffc53a;
  --accent-ink:#2b1b00;
  --ok:#62d58f;
  --warn:#ff7a4d;
  --azul:#3a78d8;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- HUD ---------- */
.hud-top{position:fixed;left:0;right:0;top:0;z-index:5;display:grid;gap:8px;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud-top > *{pointer-events:auto}
.bar-row{display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.rtitle{display:flex;flex-direction:column;min-width:0;flex:1}
#hName{font-family:var(--display);font-weight:800;font-size:21px;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.5)}
#hStep{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:3px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
#hScore{font-family:var(--display);font-weight:800;font-size:16px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
#hScore b{color:var(--accent)}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.16)}
.dots i.done{background:var(--accent)}
.dots i.now{background:var(--fg)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:560px}
#hText{margin:0;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.18;text-wrap:balance}
#hHint{margin:4px 0 0;font-size:13.5px;color:var(--muted);line-height:1.35}
#hChips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#hChips:empty{display:none}
.chip{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.chip.on{background:rgba(98,213,143,.16);border-color:rgba(98,213,143,.5);color:#c9f5d9}
.chip.need{background:rgba(255,197,58,.16);border-color:rgba(255,197,58,.55);color:#ffe3a0}
.chip.cur{outline:2px solid var(--fg);outline-offset:1px}
#warn{justify-self:start;background:rgba(255,90,50,.92);color:#fff;font-weight:700;font-size:13.5px;padding:6px 12px;border-radius:999px;animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.05)}}

.hud-bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;gap:10px;justify-items:stretch;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud-bottom > *{pointer-events:auto;width:100%;max-width:560px;justify-self:center;box-sizing:border-box}
#meter{padding:10px 14px 12px}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
#mLabel{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
#mState{font-family:var(--display);font-weight:800;font-size:17px}
.track{position:relative;height:16px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}
.track .win{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(98,213,143,.45) 0 6px,rgba(98,213,143,.28) 6px 12px);border-left:2px solid var(--ok);border-right:2px solid var(--ok)}
.track .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffdf8a,var(--accent));border-radius:8px;box-shadow:0 0 12px rgba(255,197,58,.5)}
.track .fill.hot{background:linear-gradient(90deg,var(--accent),var(--warn))}
#actBtn{height:56px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:20px;box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.18)}
#actBtn:active{transform:translateY(2px)}
#tip{justify-self:center;font-size:13px;color:var(--fg);background:var(--glass-soft);border:1px solid var(--line);padding:7px 12px;border-radius:999px;text-align:center;width:auto!important}

#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;text-align:center;opacity:0}
#toast.show{animation:toast 1.25s ease-out forwards}
#toast .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--accent);text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 24px rgba(0,0,0,.5);white-space:nowrap}
#toast .small{font-weight:700;font-size:15px;margin-top:4px;text-shadow:0 2px 8px rgba(0,0,0,.8)}
#toast.bad .big{color:var(--warn)}
#toast.mini .big{font-size:24px;color:var(--fg)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

/* ---------- MENU ---------- */
#menu{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(to top,rgba(7,18,13,.97) 0%,rgba(7,18,13,.88) 48%,rgba(7,18,13,.15) 78%,rgba(7,18,13,0) 100%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
.menu-in{width:100%;max-width:520px;margin:0 auto;display:grid;gap:14px;max-height:100%;overflow:auto;touch-action:pan-y;padding-top:24px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{margin:2px 0 0;font-family:var(--display);font-weight:800;font-size:clamp(42px,12vw,64px);line-height:.92;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.lede{margin:6px 0 0;color:var(--muted);line-height:1.45;max-width:42ch}
.rlist{display:grid;gap:10px}
.rcard{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;text-align:left;padding:11px 12px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid var(--line);transition:background .15s,transform .15s}
.rcard:hover{background:rgba(255,255,255,.1)}
.rcard:active{transform:scale(.98)}
.rcard .nm{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.05}
.rcard .mt{font-size:12.5px;color:var(--muted);margin-top:3px}
.dish{width:58px;height:58px;border-radius:50%;position:relative;box-shadow:inset 0 0 0 4px #f4f1ea,inset 0 0 0 5px #d8d2c4,0 4px 10px rgba(0,0,0,.35);background:#f4f1ea}
.dish::after{content:"";position:absolute;inset:12px;border-radius:50%}
.d-brig::after{background:radial-gradient(circle at 34% 30%,#8a5634 0 12%,transparent 13%),radial-gradient(circle at 50% 50%,#3d1d10 0 64%,transparent 66%),repeating-conic-gradient(#2b1409 0 8deg,#55301c 8deg 16deg);}
.d-tap::after{inset:10px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:linear-gradient(170deg,#fbf8ef 0 48%,#f2e4b4 48% 54%,#fbf8ef 54%);box-shadow:inset 0 -3px 0 #e7dcc4}
.d-pao::after{background:radial-gradient(circle at 36% 32%,#f8d98c 0 10%,transparent 11%),radial-gradient(circle,#dca043 0 52%,#b5762a 70%,transparent 72%)}
.d-moq{background:#5b3524;box-shadow:inset 0 0 0 4px #6f4430,0 4px 10px rgba(0,0,0,.35)}
.d-moq::after{inset:8px;background:radial-gradient(circle at 40% 40%,#f6efe4 0 9%,transparent 10%),radial-gradient(circle at 64% 60%,#c92b1d 0 8%,transparent 9%),radial-gradient(circle at 34% 66%,#3f8f3a 0 6%,transparent 7%),radial-gradient(circle,#e77a25,#c85216)}
.stars{display:flex;gap:2px}
.stars svg{width:17px;height:17px}
.foot{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}

/* ---------- RESULT ---------- */
#result{position:fixed;inset:0;z-index:12;display:grid;place-items:center;background:rgba(4,12,9,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rbox{width:100%;max-width:420px;box-sizing:border-box;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:22px 20px 18px;display:grid;gap:12px;text-align:center;animation:rise .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{transform:translateY(30px) scale(.94);opacity:0}}
.rbox .eyebrow{justify-self:center}
.rbox h2{margin:0;font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.bigstars{display:flex;justify-content:center;gap:8px}
.bigstars svg{width:52px;height:52px}
.bigstars svg.on{animation:starpop .5s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}}
#rScore{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
#rMsg{margin:0;color:var(--muted);line-height:1.4}
.rsteps{list-style:none;margin:0;padding:0;text-align:left;max-height:30vh;overflow:auto;display:grid;gap:4px;touch-action:pan-y}
.rsteps li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.05)}
.rsteps li span:first-child{min-width:0;color:var(--muted)}
.rsteps li b{font-variant-numeric:tabular-nums}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.btn{height:50px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-family:var(--display);font-weight:800;font-size:17px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border:0}

/* ---------- LANDSCAPE LAYER (game always horizontal) ---------- */
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0;overflow:hidden;container-type:size}
.hud-top{gap:6px;padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
.hud-top .card{max-width:440px;padding:9px 12px}
.dots{max-width:440px}
#hText{font-size:17px}
#hHint{font-size:12.5px}
.hud-bottom{display:flex;justify-content:center;align-items:flex-end;gap:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
.hud-bottom > *{width:auto;max-width:none}
#meter{width:min(440px,56%)}
#actBtn{padding:0 22px;height:52px;font-size:18px}
#btnStation{height:42px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
#btnStation .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
#btnStation .eq i{width:3px;background:var(--accent);border-radius:1px;animation:eq .9s ease-in-out infinite alternate}
#btnStation .eq i:nth-child(2){animation-delay:.3s}#btnStation .eq i:nth-child(3){animation-delay:.6s}
@keyframes eq{from{height:3px}to{height:12px}}
.muted #btnStation .eq i{animation:none;height:3px;background:var(--muted)}
.icon-btn.off{opacity:.5}
#menu{justify-content:center;background:linear-gradient(90deg,rgba(7,18,13,.96) 0%,rgba(7,18,13,.86) 58%,rgba(7,18,13,.3) 100%);padding-top:12px;padding-bottom:12px}
.menu-in{max-width:980px;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);align-items:center;gap:20px 28px;padding-top:0;box-sizing:border-box;height:100%;overflow:visible}
.menu-left{display:grid;gap:12px;align-content:center;min-width:0}
h1{font-size:clamp(34px,13cqh,62px)}
.lede{font-size:14px}
.rlist{grid-template-columns:1fr 1fr;max-height:100%;overflow:auto;align-content:center;padding:4px;touch-action:pan-y;box-sizing:border-box}
.rcard{grid-template-columns:50px minmax(0,1fr);padding:10px}
.rcard .dish{width:50px;height:50px}
.rcard .nm{font-size:18px}
.rcard .stars{margin-top:4px}
.rcard.wide{grid-column:1/-1;background:linear-gradient(100deg,rgba(255,197,58,.16),rgba(255,255,255,.05));border-color:rgba(255,197,58,.4)}
.audio-row{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:8px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.off .dot{background:rgba(255,255,255,.3);box-shadow:none}
.d-rod{background:#3b2419;box-shadow:inset 0 0 0 4px #5a3626,0 4px 10px rgba(0,0,0,.35)}
.d-rod::after{inset:6px;border-radius:6px;background:linear-gradient(90deg,transparent 0 8%,#9a3b26 8% 30%,transparent 30% 36%,#7a3d22 36% 58%,transparent 58% 64%,#e0a04a 64% 86%,transparent 86%),linear-gradient(#d5d8dc,#d5d8dc) center/100% 3px no-repeat;top:18px;bottom:18px}
.orders{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.order{position:relative;overflow:hidden;padding:5px 9px 8px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:12.5px;line-height:1.2;display:grid}
.order b{font-family:var(--display);font-size:13px;color:var(--accent)}
.order i{position:absolute;left:0;bottom:0;height:3px;background:var(--ok);transition:width .2s linear}
.order.urg{border-color:rgba(255,122,77,.7);background:rgba(255,122,77,.16)}
.order.urg i{background:var(--warn)}
.rbox{max-width:460px;max-height:94cqh;overflow:auto;padding:16px 18px 14px;gap:9px}
.rbox h2{font-size:28px}
.bigstars svg{width:42px;height:42px}
.rsteps{max-height:26cqh}
@container (max-width:640px){.menu-in{grid-template-columns:1fr;overflow:auto;height:auto;max-height:100%}}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--night);font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
@media (min-width:760px){#hText{font-size:22px}}
</style>

<div id="app">
<div id="stage"></div>
<div id="loading">Acendendo o fogão…</div>

<div class="hud-top" id="hudTop" hidden>
  <div class="bar-row">
    <button class="icon-btn" id="btnBack" aria-label="Voltar ao menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="rtitle"><span id="hName"></span><span id="hStep"></span></div>
    <button id="btnStation" aria-label="Trocar estação de rádio"><span class="eq"><i></i><i></i><i></i></span><span id="stName">Sertanejo</span></button>
    <button class="icon-btn" id="btnMusic" aria-label="Ligar ou desligar a música"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
    <div id="hScore"><b>0</b> pts</div>

</div>

<div class="hud-bottom" id="hudBot" hidden>
  <div id="tip" hidden>Arraste para olhar em volta · toque nos objetos para cozinhar</div>
  <div class="card" id="meter" hidden>
    <div class="mrow"><span id="mLabel"></span><span id="mState"></span></div>
    <div class="track"><div class="win" id="mWin"></div><div class="fill" id="mFill"></div></div>
  </div>
  <button id="actBtn" hidden></button>
</div>

<div id="toast"><div class="big"></div><div class="small"></div></div>

<div id="menu" hidden>
  <div class="menu-in">
    <div class="menu-left">
      <div>
        <div class="eyebrow">Cozinha brasileira em primeira pessoa</div>

</div>

<div id="result" hidden>
  <div class="rbox">

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const V3=THREE.Vector3;
const col=c=>new THREE.Color(c);
const sleep=s=>new Promise(r=>setTimeout(r,s*1000));

/* ================= RENDERER ================= */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$('#stage').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=col(0x2b2a24);
const camera=new THREE.PerspectiveCamera(60,1,.02,30);
camera.position.set(.15,1.62,.5);

/* ================= TEXTURES ================= */
function canvasTex(w,h,draw,rep){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}
  return t;
}
function drawAzulejo(g,w,h){
  g.fillStyle='#f3f5f6';g.fillRect(0,0,w,h);
  const B='#1d4f9c',L='#6a9be0';
  g.lineWidth=9;g.strokeStyle=B;
  [[0,0],[w,0],[0,h],[w,h]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,62,0,TAU);g.stroke();g.beginPath();g.arc(x,y,32,0,TAU);g.fillStyle=L;g.fill();});
  g.save();g.translate(w/2,h/2);
  for(let i=0;i<4;i++){g.rotate(Math.PI/2);g.beginPath();g.ellipse(0,-44,15,32,0,0,TAU);g.fillStyle=B;g.fill();g.beginPath();g.ellipse(0,-44,6,17,0,0,TAU);g.fillStyle='#f3f5f6';g.fill();}
  g.rotate(Math.PI/4);for(let i=0;i<4;i++){g.rotate(Math.PI/2);g.beginPath();g.arc(0,-72,8,0,TAU);g.fillStyle=L;g.fill();}
  g.beginPath();g.arc(0,0,13,0,TAU);g.fillStyle='#e3a92a';g.fill();
  g.restore();
  for(let i=0;i<900;i++){g.fillStyle=`rgba(80,110,170,${Math.random()*.05})`;g.fillRect(Math.random()*w,Math.random()*h,2,2);}
  g.strokeStyle='#c4ccd1';g.lineWidth=6;g.strokeRect(0,0,w,h);
}
function drawGranite(g,w,h){
  g.fillStyle='#16201b';g.fillRect(0,0,w,h);
  const cs=['#080d0a','#25332a','#33463a','#4c5e51','#0e1611','#72847a','#1e2a23','#3a2f26'];
  for(let i=0;i<16000;i++){g.fillStyle=cs[i%cs.length];const s=Math.random()<.85?1+Math.random()*2:3+Math.random()*5;g.globalAlpha=.45+Math.random()*.55;g.fillRect(Math.random()*w,Math.random()*h,s,s*(.5+Math.random()));}
  g.globalAlpha=1;
}
function drawWood(g,w,h,base,dark){
  g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){const x=Math.random()*w;g.strokeStyle=dark;g.globalAlpha=.07+Math.random()*.22;g.lineWidth=.6+Math.random()*2.6;g.beginPath();g.moveTo(x,0);
    for(let y=0;y<=h;y+=16)g.lineTo(x+Math.sin(y*.02+i)*4+Math.sin(y*.005+i*3)*7,y);g.stroke();}
  g.globalAlpha=1;
}
function drawFloor(g,w,h){
  const n=2,s=w/n;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const v=Math.random()*18-9;g.fillStyle=`rgb(${170+v},${88+v*.6},${60+v*.4})`;g.fillRect(i*s,j*s,s,s);}
  for(let k=0;k<2500;k++){g.fillStyle=`rgba(60,20,10,${Math.random()*.12})`;g.fillRect(Math.random()*w,Math.random()*h,2,2);}
  g.strokeStyle='#d8c6aa';g.lineWidth=6;
  for(let i=0;i<=n;i++){g.beginPath();g.moveTo(i*s,0);g.lineTo(i*s,h);g.stroke();g.beginPath();g.moveTo(0,i*s);g.lineTo(w,i*s);g.stroke();}
}
function drawSky(g,w,h){
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#4f9fe6');gr.addColorStop(.65,'#bfe2f6');gr.addColorStop(1,'#eaf6ee');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.fillStyle='rgba(255,255,255,.9)';
  [[.28,.22],[.72,.14]].forEach(([x,y])=>{for(let i=0;i<6;i++){g.beginPath();g.arc(x*w+i*20-50,y*h+Math.sin(i*1.7)*7,18+Math.random()*10,0,TAU);g.fill();}});
  // mango tree crowns and banana leaves outside
  const greens=['#2f6a2f','#3f8139','#4d9441','#26592a'];
  for(let i=0;i<40;i++){g.fillStyle=greens[i%4];g.beginPath();g.arc(Math.random()*w,h*.62+Math.random()*h*.4,22+Math.random()*34,0,TAU);g.fill();}
  g.fillStyle='#5aa244';
  for(let i=0;i<5;i++){g.save();g.translate(w*.82,h*.7);g.rotate(-1.2+i*.55);g.beginPath();g.ellipse(0,-70,16,72,0,0,TAU);g.fill();g.restore();}
}

  TEX.soft=canvasTex(64,64,(g)=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.5,'rgba(255,255,255,.45)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);});
  TEX.sprinkle=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#3a1b0f';g.fillRect(0,0,w,h);for(let i=0;i<520;i++){g.save();g.translate(Math.random()*w,Math.random()*h);g.rotate(Math.random()*TAU);g.fillStyle=['#1e0d07','#5a301b','#2c140b','#6e3d22'][i%4];g.fillRect(-4,-1.3,8,2.6);g.restore();}},[2,2]);
  TEX.marker=canvasTex(128,128,(g)=>{g.translate(64,58);g.beginPath();g.moveTo(-36,-28);g.lineTo(0,22);g.lineTo(36,-28);g.lineTo(18,-28);g.lineTo(0,-3);g.lineTo(-18,-28);g.closePath();g.lineJoin='round';g.lineWidth=12;g.strokeStyle='rgba(35,20,0,.9)';g.stroke();g.fillStyle='#ffc53a';g.fill();});
  TEX.towel=canvasTex(128,256,(g,w,h)=>{g.fillStyle='#f6f3ec';g.fillRect(0,0,w,h);[[30,'#c8352a'],[46,'#c8352a'],[200,'#2f5fae'],[214,'#2f5fae']].forEach(([y,c])=>{g.fillStyle=c;g.fillRect(0,y,w,8);});for(let i=0;i<1500;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.05})`;g.fillRect(Math.random()*w,Math.random()*h,1,2);}});
  TEX.brick=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#d6c2a3';g.fillRect(0,0,w,h);const bh=32,bw=64;
    for(let r=0;r<h/bh;r++)for(let c=-1;c<w/bw+1;c++){const x=c*bw+(r%2?bw/2:0),v=Math.random()*30-15;g.fillStyle=`rgb(${168+v},${74+v*.5},${46+v*.3})`;g.fillRect(x+3,r*bh+3,bw-6,bh-6);
      for(let k=0;k<40;k++){g.fillStyle=`rgba(40,10,0,${Math.random()*.15})`;g.fillRect(x+3+Math.random()*(bw-8),r*bh+3+Math.random()*(bh-8),2,2);}}
    // soot near the top
    const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(20,10,5,.35)');gr.addColorStop(.5,'rgba(20,10,5,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);},[2,2]);
  TEX.coal=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#000';g.fillRect(0,0,w,h);
    for(let i=0;i<260;i++){const x=Math.random()*w,y=Math.random()*h,r=4+Math.random()*16;const gr=g.createRadialGradient(x,y,0,x,y,r);const hot=Math.random();
      gr.addColorStop(0,hot>.6?'rgba(255,200,90,1)':hot>.3?'rgba(255,110,30,.95)':'rgba(170,40,10,.8)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}
    for(let i=0;i<500;i++){g.fillStyle=Math.random()<.5?'rgba(12,8,6,.9)':'rgba(90,85,80,.5)';g.fillRect(Math.random()*w,Math.random()*h,3+Math.random()*6,3+Math.random()*5);}});
  TEX.mesh=canvasTex(128,128,(g,w,h)=>{g.clearRect(0,0,w,h);g.strokeStyle='rgba(200,205,210,.9)';g.lineWidth=1.5;for(let i=0;i<w;i+=6){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke();}});
}
function label(bg,fg,title,sub,band,wrap){
  const W=wrap?1024:512;
  return canvasTex(W,256,(g,w,h)=>{
    g.fillStyle=bg;g.fillRect(0,0,w,h);
    g.fillStyle=band;g.fillRect(0,h*.66,w,h*.1);
    g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';
    g.font='800 66px "Baloo 2", sans-serif';g.fillText(title,w/2,h*.36,480);
    g.font='600 32px Figtree, sans-serif';g.fillText(sub,w/2,h*.89,480);
  });
}

/* ================= MATERIAL / MESH HELPERS ================= */
function mStd(c,rough=.6,metal=0,extra={}){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:rough,metalness:metal},extra));}
function mesh(geo,mat,cast=true){const m=new THREE.Mesh(geo,mat);m.castShadow=cast;m.receiveShadow=true;return m;}
function latheGeo(pts,seg=48){return new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg);}
function boxAt(parent,w,h,d,mat,x,y,z,cast=true){const m=mesh(new THREE.BoxGeometry(w,h,d),mat,cast);m.position.set(x,y,z);parent.add(m);return m;}
const PROXY_MAT=new THREE.MeshBasicMaterial({visible:false});

/* ================= ENVIRONMENT MAP ================= */
function buildEnv(){
  const pm=new THREE.PMREMGenerator(renderer);
  const es=new THREE.Scene();
  const geo=new THREE.SphereGeometry(10,32,16);
  const p=geo.attributes.position,cols=[];
  const top=col('#fff3dc'),mid=col('#9fcfbf'),bot=col('#6b4632');
  for(let i=0;i<p.count;i++){const y=p.getY(i)/10;const c=y>0?mid.clone().lerp(top,y):mid.clone().lerp(bot,-y);cols.push(c.r,c.g,c.b);}
  geo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  es.add(new THREE.Mesh(geo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
  const win=new THREE.Mesh(new THREE.PlaneGeometry(5,3.5),new THREE.MeshBasicMaterial({color:new THREE.Color(4,4.2,4.6)}));
  win.position.set(-4,4,-8);win.lookAt(0,0,0);es.add(win);
  const lamp=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.MeshBasicMaterial({color:new THREE.Color(5,4.5,3.8)}));
  lamp.position.set(0,9,0);lamp.lookAt(0,0,0);es.add(lamp);
  scene.environment=pm.fromScene(es,.04).texture;
}

const parts=[];const bubbles=[];
function buildParticles(){
  for(let i=0;i<70;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX.soft,transparent:true,depthWrite:false,opacity:0}));s.visible=false;scene.add(s);parts.push({s,life:0,max:1});}
  const bg=new THREE.SphereGeometry(1,10,8);
  for(let i=0;i<26;i++){const m=new THREE.Mesh(bg,mStd(0xffffff,.15,0,{transparent:true,opacity:.85}));m.visible=false;scene.add(m);bubbles.push({m,life:0,max:.3,size:.006});}
}
function emit(pos,o){
  const p=parts.find(q=>q.life<=0);if(!p)return;
  p.s.position.copy(pos);p.life=p.max=o.life||1.6;p.vel=o.vel||new V3(rnd(-.02,.02),rnd(.08,.14),rnd(-.02,.02));
  p.s0=o.s0||.03;p.s1=o.s1||.16;p.op=o.op||.32;p.s.material.color.set(o.color||0xffffff);p.s.visible=true;p.grav=o.grav||0;
}
function bubble(pos,color,size){const b=bubbles.find(q=>q.life<=0);if(!b)return;b.m.position.copy(pos);b.life=b.max=rnd(.2,.4);b.size=size||rnd(.004,.009);b.m.material.color.copy(color).lerp(col(0xffffff),.25);b.m.visible=true;}
function updateParticles(dt){
  for(const p of parts){if(p.life<=0)continue;p.life-=dt;const k=1-p.life/p.max;
    p.vel.y-=p.grav*dt;p.s.position.addScaledVector(p.vel,dt);const sc=lerp(p.s0,p.s1,k);p.s.scale.set(sc,sc,1);
    p.s.material.opacity=p.op*Math.sin(Math.PI*Math.min(1,k*1.2));if(p.life<=0)p.s.visible=false;}
  for(const b of bubbles){if(b.life<=0)continue;b.life-=dt;const k=1-b.life/b.max;const sc=b.size*Math.sin(Math.PI*k);b.m.scale.set(sc,sc*.7,sc);if(b.life<=0)b.m.visible=false;}
}

let tweens=[];
function tween(dur,fn){return new Promise(res=>{tweens.push({t:0,dur,fn,res});});}
function updateTweens(dt){
  const list=tweens.slice();
  for(const tw of list){tw.t+=dt;const k=Math.min(1,tw.t/tw.dur);tw.fn(ease(k),k);if(k>=1){tweens.splice(tweens.indexOf(tw),1);tw.res();}}
}
function arcTo(obj,to,dur,h=.12,extra){
  const a=obj.position.clone();
  return tween(dur,(e,k)=>{obj.position.lerpVectors(a,to,e);obj.position.y+=Math.sin(Math.PI*e)*h;extra&&extra(e,k);});
}

function defaultHint(s){
  switch(s.type){case 'add':return 'Toque em cada ingrediente marcado.';case 'knob':return `Toque no botão do fogão até o fogo ficar em ${LEVEL[s.level].toUpperCase()}.`;
    case 'taps':return 'Toque várias vezes no ponto marcado.';case 'chop':return G.ss.phase==='move'?'Toque na panela para colocar.':'Toque na tábua para cortar.';
    case 'stir':case 'stircook':return 'Arraste o dedo em círculos sobre a panela.';case 'timing':return 'Toque no ponto marcado quando estiver no ponto.';
    case 'wait':return '';default:return 'Toque no ponto marcado.';}
}
function renderHUD(){
  const s=G.step;if(!s)return;
  hud.name.textContent=G.recipe.name;hud.step.textContent=`Etapa ${G.idx+1} de ${G.steps.length}`;
  hud.dots.innerHTML=G.steps.map((_,i)=>`<i class="${i<G.idx?'done':i===G.idx?'now':''}"></i>`).join('');
  hud.text.textContent=s.text;
  hud.hint.textContent=(s.type==='chop'&&G.ss.phase==='move')?'Toque na panela para colocar.':(s.hint||defaultHint(s));
  let chips='';
  if(s.type==='add')chips=s.items.map(i=>`<span class="chip ${G.ss.done.includes(i)?'on':''}">${G.ss.done.includes(i)?'✓ ':''}${ING[i].name}</span>`).join('');
  if(s.type==='knob')chips=LEVEL.map((l,i)=>`<span class="chip ${i===s.level?'need':''} ${i===G.burners[s.burner]?'cur':''}">${l}</span>`).join('');
  hud.chips.innerHTML=chips;
  const metered=['taps','chop','stir','stircook','timing','wait'].includes(s.type);
  hud.meter.hidden=!metered;
  if(metered){
    hud.mLabel.textContent=s.meter||({taps:'Progresso',chop:'Cortes',stir:'Mistura',stircook:'Ponto',timing:'Ponto',wait:'Tempo'}[s.type]);
    if(s.window){hud.mWin.hidden=false;hud.mWin.style.left=(s.window[0]/s.max*100)+'%';hud.mWin.style.width=((s.window[1]-s.window[0])/s.max*100)+'%';}else hud.mWin.hidden=true;
  }
  hud.act.hidden=!s.button;if(s.button)hud.act.textContent=s.button;
  updateScore();
}
function updateScore(){const t=G.scores.reduce((a,b)=>a+b.score,0);hud.score.innerHTML=`<b>${t}</b> pts`;}
function stateLabel(s,p){let l=s.labels[0][1];for(const [th,txt] of s.labels)if(p>=th)l=txt;return l;}
function updateMeterHUD(){
  const s=G.step,ss=G.ss;if(!s||hud.meter.hidden)return;
  let p=0,label='',cls='';
  if(s.type==='taps'){p=ss.k/s.count;label=`${ss.k} / ${s.count}`;}
  else if(s.type==='chop'){p=ss.k/s.count;label=ss.phase==='move'?'Cortado!':`${ss.k} / ${s.count}`;}
  else if(s.type==='stir'){p=ss.amt/s.amount;label=p>=1?'Pronto':(G.stirring?'Mexendo…':'Parado');}
  else if(s.type==='wait'){p=ss.p;label=s.label||'Aguarde';}
  else{p=ss.p/s.max;label=stateLabel(s,ss.p);if(ss.p>=s.window[0]&&ss.p<=s.window[1])cls='ok';else if(ss.p>s.window[1])cls='hot';
    if(s.type==='stircook'&&ss.p<s.window[0])label+=G.stirring?' · mexendo':' · parado';}
  hud.mFill.style.width=(clamp(p,0,1)*100)+'%';
  hud.mFill.classList.toggle('hot',cls==='hot');
  hud.mState.textContent=label;hud.mState.style.color=cls==='ok'?'var(--ok)':cls==='hot'?'var(--warn)':'var(--fg)';
}

/* ================= STEP ENGINE ================= */
function targetsOf(s){
  if(!s)return[];
  switch(s.type){case 'add':return s.items.filter(i=>!G.ss.done.includes(i));case 'knob':return['knob'+s.burner];
    case 'chop':return G.ss.phase==='move'?[s.to]:['tabua'];case 'wait':return[];default:return[s.target];}
}
function startRecipe(id){
  if(RECIPES[id].mode==='rodizio'){startRodizio();return;}
  G.session++;clearRecipe();G.recipe=RECIPES[id];G.recipe.setup();G.steps=G.recipe.steps;G.idx=-1;G.scores=[];G.mode='play';G.busy=false;
  $('#menu').hidden=true;$('#result').hidden=true;hud.top.hidden=false;hud.bot.hidden=false;
  if(!G.tipShown){G.tipShown=true;$('#tip').hidden=false;setTimeout(()=>{$('#tip').hidden=true;},6000);}
  nextStep();
}
async function nextStep(){
  const sess=G.session;
  G.idx++;
  if(G.idx>=G.steps.length){finishRecipe();return;}
  const s=G.step=G.steps[G.idx];
  G.ss={done:[],k:0,p:0,amt:0,phase:'chop',extra:0,taps:0,stick:0,pen:0};
  G.lastTarget=null;renderHUD();
  if(s.enter){G.busy=true;await s.enter();if(sess!==G.session)return;G.busy=false;}
  if(s.type==='chop'){G.busy=true;await chopEnter(s);if(sess!==G.session)return;G.busy=false;}
  if(s.type==='stir'||s.type==='stircook')G.spoonAng=0;
  renderHUD();
}
async function completeStep(score,big,small){
  const sess=G.session;G.busy=true;score=Math.round(clamp(score,0,100));
  G.scores.push({text:G.step.short||G.step.text,score});updateScore();
  spoon.visible=false;hud.act.hidden=true;
  const bad=score<60;toast(big||(score>=95?'Perfeito!':score>=75?'Muito bom!':score>=50?'Deu certo':'Ops…'),small||`+${score} pts`,bad?'bad':'');
  bad?SFX.bad():SFX.ding();
  if(G.step.after)await G.step.after();
  if(sess!==G.session)return;
  await sleep(.7);
  if(sess!==G.session)return;
  G.busy=false;nextStep();
}
function timingScore(s,p){
  const [a,b]=s.window;
  if(p>=s.max)return[15,s.burnBig||'Queimou!'];
  if(p>=a&&p<=b)return[100,'No ponto!'];
  if(p<a)return[Math.max(20,100-(a-p)*3),'Cedo demais'];
  return[Math.max(15,100-(p-b)*4.5),'Passou do ponto'];
}
function finishTiming(){
  const s=G.step;const [sc,lbl]=timingScore(s,G.ss.p);
  if(s.type==='stircook'){setBurner(s.burner,0);completeStep(sc-G.ss.pen,lbl,G.ss.pen>5?`grudou um pouco · +${Math.round(clamp(sc-G.ss.pen,0,100))} pts`:undefined);}
  else completeStep(sc,lbl);
}
hud.act.addEventListener('click',()=>{if(G.busy||!G.step)return;initAudio();if(G.step.type==='stircook'){if(G.ss.p<5){toast('Ainda cru','mexa um pouco mais','mini');return;}finishTiming();}});

async function onTap(id){
  if(G.mode!=='play'||G.busy||!id)return;
  if(G.rod){rodTap(id);return;}
  const s=G.step;if(!s)return;
  // knobs work any time
  if(id.startsWith('knob')){
    const b=+id[4];
    if(b===4){setOven(!G.oven);SFX.click();toast(G.oven?'Forno ligado':'Forno desligado','', 'mini');return;}
    const l=(G.burners[b]+1)%4;setBurner(b,l);SFX.click();toast('Fogo '+LEVEL[l].toLowerCase(),'','mini');
    if(s.type==='knob'&&s.burner===b){G.ss.taps++;renderHUD();if(l===s.level){completeStep(100-Math.max(0,G.ss.taps-s.level)*8,'Fogo '+LEVEL[l].toLowerCase()+'!');}}
    return;
  }
  const targets=targetsOf(s);
  if(s.type==='add'){
    if(targets.includes(id)){G.busy=true;const sess=G.session;const ing=ING[id];const C=CT[s.to];
      if(ing.kind==='pour')await animPour(ing,C);else await animDrop(ing,C);
      if(sess!==G.session)return;
      G.ss.done.push(id);G.busy=false;renderHUD();G.lastTarget=null;
      if(G.ss.done.length===s.items.length)completeStep(100-G.ss.pen,G.ss.pen?'Feito':'Perfeito!');
    }else if(ING[id]){G.ss.pen=Math.min(40,G.ss.pen+10);SFX.bad();toast('Ainda não!',`${ING[id].name} vem depois`,'bad');}
    else hintWrong();
    return;
  }
  if(!targets.includes(id)){if(ING[id]&&!ING[id].obj.visible)return;hintWrong();return;}
  if(s.type==='taps'){G.ss.k++;const sess=G.session;s.onTap&&s.onTap(G.ss.k,s.count);if(G.ss.k>=s.count){G.busy=true;await sleep(.35);if(sess!==G.session)return;completeStep(100);}return;}
  if(s.type==='chop'){
    if(G.ss.phase==='chop'){G.ss.k++;chopOnce(s,G.ss.k);if(G.ss.k>=s.count){G.ss.phase='move';G.lastTarget=null;renderHUD();}}
    else{G.busy=true;const sess=G.session;await chopMove(s);if(sess!==G.session)return;completeStep(100,'Na panela!');}
    return;
  }
  if(s.type==='timing'){finishTiming();return;}
  if(s.type==='action'){G.busy=true;const sess=G.session;await s.run();if(sess!==G.session)return;completeStep(100,s.ok||'Feito!');return;}
  if(s.type==='stir'||s.type==='stircook'){toast('Arraste em círculos','sobre a panela, sem soltar','mini');return;}
}
function hintWrong(){toast('Toque no marcado','siga a seta amarela','mini');}

function stepUpdate(dt){
  const s=G.step;if(!s||G.mode!=='play')return;const ss=G.ss;
  G.stirring=G.time-G.lastStir<.35;
  if(s.type==='stircook'&&!G.busy){
    const hf=heatF(G.burners[s.burner]);
    ss.p+=s.rate*hf*dt*(G.stirring?1:.45);
    if(hf>0&&!G.stirring&&ss.p>8){ss.stick+=dt*hf;}else ss.stick=Math.max(0,ss.stick-dt*1.5);
    if(ss.stick>1.1){ss.pen+=dt*7*hf;warn('Mexa! Está grudando no fundo');}
    if(G.burners[s.burner]===3){ss.pen+=dt*3;if(G.time>G.warnUntil-.2)warn('Fogo alto demais, abaixe!');}
    if(hf===0&&G.time>G.warnUntil)warn('O fogo está desligado');
    s.onP&&s.onP(ss.p,dt);
    if(ss.p>=s.max){finishTiming();}
  }
  if(s.type==='timing'&&!G.busy){
    const hf=s.oven?(G.oven?1:0):heatF(G.burners[s.burner]);
    ss.p+=s.rate*hf*dt;
    if(hf===0&&G.time>G.warnUntil&&ss.p<s.window[0])warn(s.oven?'O forno está desligado':'O fogo está desligado');
    s.onP&&s.onP(ss.p,dt);
    if(ss.p>=s.max)finishTiming();
  }
  if(s.type==='stir'){s.onP&&s.onP(ss.amt/s.amount);if(ss.amt>=s.amount&&!G.busy)completeStep(100,'Bem misturado!');}
  if(s.type==='wait'&&!G.busy){ss.p+=dt/s.dur;s.onP&&s.onP(ss.p);if(ss.p>=1){ss.p=1;completeStep(100,s.ok||'Pronto');}}
  if((s.type==='stir'||s.type==='stircook')&&!G.busy){const C=CT[s.target];setSpoon(C,G.spoonAng||0,G.stirring?0:.25);}
  updateMeterHUD();
  if(!hud.warn.hidden&&G.time>G.warnUntil)hud.warn.hidden=true;
}

/* ---------- chopping ---------- */
const BOARD={x:-.42,y:.942,z:-.62};
async function chopEnter(s){
  const ing=ING[s.item];const o=ing.obj;focusOn(new V3(BOARD.x,BOARD.y,BOARD.z));
  ing.pieces=new THREE.Group();ing.pieces.position.set(BOARD.x,BOARD.y,BOARD.z);RG.add(ing.pieces);
  knife.visible=true;knife.position.set(BOARD.x+.16,BOARD.y+.002,BOARD.z+.06);knife.rotation.set(0,.3,Math.PI/2);
  await arcTo(o,new V3(BOARD.x+.03,BOARD.y,BOARD.z),.7,.14);
  knife.rotation.set(0,0,0);knife.position.set(BOARD.x+.09,BOARD.y+.06,BOARD.z);
}
function chopOnce(s,k){
  const ing=ING[s.item],o=ing.obj,n=s.count;
  const frac=1-k/n*.85;o.scale.x=frac;o.position.x=BOARD.x+.03+.035*(1-frac);
  const cutX=BOARD.x+.03-.035*frac+.035*(1-frac);
  const y0=BOARD.y+.06;
  knife.position.x=cutX;
  tween(.08,e=>{knife.position.y=lerp(y0,BOARD.y+.001,e);}).then(()=>{SFX.chop();tween(.12,e=>{knife.position.y=lerp(BOARD.y+.001,y0,e);});});
  const pc=ing.slice();pc.position.set(-.06-k*.016+rnd(-.004,.004),.004+(k%2)*.003,rnd(-.02,.02));pc.rotation.set(0,rnd(-.4,.4),0);ing.pieces.add(pc);
  if(k>=n){o.visible=false;knife.visible=false;for(let i=0;i<3;i++){const p2=ing.slice();p2.position.set(.02+i*.016,.004,rnd(-.02,.02));ing.pieces.add(p2);}}
}
async function chopMove(s){
  const ing=ING[s.item],C=CT[s.to];const pg=ing.pieces;
  const tgt=new V3(C.group.position.x,C.surf()+.02,C.group.position.z);
  focusOn(tgt);SFX.whoosh();
  await arcTo(pg,tgt,.75,.14);
  pg.visible=false;SFX.plop();
  C.add(ing.color,ing.amount||.08,ing.weight||1);
  C.addChunks(()=>ing.slice(true),ing.nChunks||6,.72);
}

function sliceRing(c,r=.026,tube=.004){return()=>{const m=mesh(new THREE.TorusGeometry(r*rnd(.75,1.1),tube,6,20),mStd(c,.45),false);m.rotation.x=Math.PI/2;return m;};}
function sliceDisc(c,r=.028,inner){return()=>{const g=new THREE.Group();const m=mesh(new THREE.CylinderGeometry(r,r,.006,20),mStd(c,.35),false);g.add(m);
  if(inner){const i=mesh(new THREE.CylinderGeometry(r*.75,r*.75,.0065,20),mStd(inner,.45),false);g.add(i);}return g;};}

const MEATS={

const MEAT_KEYS=Object.keys(MEATS);
const PONTOS={mal:['mal passada',[42,60]],ponto:['ao ponto',[60,76]],bem:['bem passada',[76,90]]};
const RSLOTS=[-.48,-.6,-.72,-.84];

const orderWin=o=>MEATS[o.type].pontos?PONTOS[o.ponto][1]:[62,88];
const orderTxt=o=>MEATS[o.type].pontos?`${MEATS[o.type].name} ${PONTOS[o.ponto][0]}`:MEATS[o.type].name;
function doneTxt(type,p){
  if(p>=97)return'Queimado';
  if(MEATS[type].pontos){if(p<42)return'Crua';if(p<60)return'Mal passada';if(p<76)return'Ao ponto';if(p<90)return'Bem passada';return'Passando!';}
  if(p<35)return'Cru';if(p<62)return'Assando';if(p<88)return MEATS[type].ok||'No ponto';return'Passando!';
}
function skewer(type){
  const g=new THREE.Group(),parts=[];
  const rod=mesh(new THREE.CylinderGeometry(.0035,.0035,.8,8),mStd(0xd5d8dc,.25,.9));rod.rotation.z=Math.PI/2;g.add(rod);
  const hd=mesh(new THREE.CylinderGeometry(.011,.011,.11,12),mStd(0x6b4226,.6));hd.rotation.z=Math.PI/2;hd.position.x=-.45;g.add(hd);
  const M=(raw,cook,burn,rough=.55)=>{const m=mStd(raw,rough);parts.push({m,raw:col(raw),cook:col(cook),burn:col(burn)});return m;};
  const along=(geo,mat,x,y=0)=>{const m=mesh(geo,mat);m.position.set(x,y,0);g.add(m);return m;};
  if(type==='picanha'){const mm=M('#b52f2b','#7d3b22','#25120a',.5),fat=M('#f1e4c8','#d9a35a','#3a2314',.4);
    for(let i=0;i<3;i++){const pc=new THREE.Group();pc.position.set(-.15+i*.15,.012,0);pc.rotation.y=Math.PI/2;g.add(pc);
      const c=mesh(new THREE.TorusGeometry(.026,.017,10,18,Math.PI*1.35),mm);c.rotation.z=-.54;pc.add(c);
      const f=mesh(new THREE.TorusGeometry(.042,.006,8,18,Math.PI*1.35),fat);f.rotation.z=-.54;pc.add(f);
      for(let k=0;k<6;k++){const s=mesh(new THREE.BoxGeometry(.004,.004,.004),mStd(0xffffff,.3),false);const a=-.4+k*.55;s.position.set(Math.cos(a)*.047,Math.sin(a)*.047,rnd(-.012,.012));pc.add(s);}}}
  if(type==='linguica'){const mm=M('#d98b7d','#8f4a28','#2a150b',.4);
    for(let i=0;i<4;i++){const x=-.2+i*.13;const c=along(new THREE.CylinderGeometry(.016,.016,.075,14),mm,x);c.rotation.z=Math.PI/2;
      [-1,1].forEach(s=>along(new THREE.SphereGeometry(.016,12,8),mm,x+s*.0375));}}
  if(type==='coracao'){const mm=M('#7d1f27','#5a2a1b','#1d0e08',.35);
    for(let i=0;i<11;i++){const h=along(new THREE.SphereGeometry(.012,12,10),mm,-.24+i*.048);h.scale.set(1.15,1,1.35);h.rotation.x=rnd(-.5,.5);}}
  if(type==='queijo'){const mm=M('#f3e5b4','#d99c45','#4a2a12',.6);
    for(let i=0;i<3;i++)along(new THREE.BoxGeometry(.06,.03,.03),mm,-.14+i*.14);}
  if(type==='paoalho'){const mm=M('#efdcb0','#d29a4c','#40240f',.8),top=M('#e8e3c4','#c7a058','#3a2410',.7);
    for(let i=0;i<4;i++){const x=-.2+i*.13;const c=along(new THREE.CylinderGeometry(.024,.024,.04,16),mm,x);c.rotation.z=Math.PI/2;
      const t=along(new THREE.SphereGeometry(.02,12,8),top,x,.012);t.scale.set(.9,.5,1);
      for(let k=0;k<4;k++){const s=mesh(new THREE.BoxGeometry(.004,.002,.004),mStd(0x4f8f3a,.6),false);s.position.set(x+rnd(-.012,.012),.022,rnd(-.012,.012));g.add(s);}}}
  if(type==='abacaxi'){const mm=M('#f3c93a','#c9832a','#3a210e',.5);
    const c=along(new THREE.CylinderGeometry(.045,.045,.22,14),mm,0);c.rotation.z=Math.PI/2;
    for(let k=0;k<20;k++){const s=mesh(new THREE.BoxGeometry(.006,.003,.006),mStd(0x7a4a22,.8),false);const a=rnd(0,TAU);s.position.set(rnd(-.1,.1),Math.cos(a)*.046,Math.sin(a)*.046);g.add(s);}}
  return{g,parts};
}

function spawnOrder(){

function rodScore(o,p){const [a,b]=orderWin(o);if(p>=a&&p<=b)return 100;return Math.max(15,Math.round(100-(p<a?a-p:p-b)*4));}
function matchFor(sk){let best=null,bs=-1;for(const o of G.rod.orders){if(o.type!==sk.type)continue;const s=rodScore(o,sk.p);if(s>bs||(s===bs&&o.t<best.t)){bs=s;best=o;}}return best?{o:best,s:bs}:null;}

async function rodTap(id){

        else{R.combo=0;big=m.s>=70?'Boa!':'Mesa aceitou';SFX.cash();}

    RG.remove(sk.g);

}
function rodUpdate(dt){
  const R=G.rod;if(!R||G.mode!=='play')return;
  R.t-=dt;
  let hot=false;
  R.slots.forEach((sk,i)=>{if(!sk||sk.busy)return;sk.p+=MEATS[sk.type].rate*dt;setDone(sk);
    sk.g.rotation.x=Math.sin(G.time*.6+i)*.15;
    if(sk.p>90)hot=true;
    if(Math.random()<dt*(1.2+sk.p/60)){const x=.35+rnd(-.22,.22);emit(new V3(x,1.0,RSLOTS[i]),{color:0x9a948c,op:.22,s1:.2,life:1.8,vel:new V3(rnd(-.02,.02),rnd(.12,.2),rnd(-.03,0))});}
    if(Math.random()<dt*.5){const x=.35+rnd(-.22,.22);for(let k=0;k<4;k++)emit(new V3(x,.92,RSLOTS[i]),{color:0xff9a30,op:.7,s0:.03,s1:.08,life:.35,vel:new V3(rnd(-.03,.03),.35,0)});SFX.crackle();}
    const m=matchFor(sk);const lbl=doneTxt(sk.type,sk.p);const ready=m&&m.s>=95;
    const key=lbl+(ready?m.o.mesa:'');
    if(key!==sk.lab){sk.lab=key;drawTag(R.tags[i],MEATS[sk.type].name,ready?`Pronto p/ Mesa ${m.o.mesa}`:lbl,ready?'rgba(30,140,75,.92)':sk.p>=90?'rgba(200,60,30,.92)':'rgba(9,26,19,.85)');}
  });
  if(hot&&G.time>G.warnUntil)warn('Tem espeto passando do ponto!');
  if(!hud.warn.hidden&&G.time>G.warnUntil)hud.warn.hidden=true;
  for(const o of [...R.orders]){o.t-=dt;if(o.t<=0){R.orders.splice(R.orders.indexOf(o),1);R.lost++;R.combo=0;R.pts=Math.max(0,R.pts-30);toast(`Mesa ${o.mesa} desistiu`,'virou o cartão para o vermelho · −30','bad');SFX.bad();}}
  R.next-=dt;if(R.next<=0){spawnOrder();R.next=rnd(5.5,9)*(R.t<45?.8:1);}
  if(R.orders.length===0&&R.next>2)R.next=2;
  // embers
  if(Math.random()<dt*14)emit(new V3(.35+rnd(-.3,.3),.9,-.68+rnd(-.24,.24)),{color:0xff7a20,op:.9,s0:.008,s1:.004,life:rnd(.6,1.3),vel:new V3(rnd(-.03,.03),rnd(.15,.35),rnd(-.03,.03))});
  R.hudT-=dt;if(R.hudT<=0){R.hudT=.2;renderRodHUD();}
  if(R.t<=0)finishRodizio();
}

const ray=new THREE.Raycaster();const ndc=new THREE.Vector2();
let ROT=false,APPW=innerWidth,APPH=innerHeight;
function toApp(e){return ROT?{x:e.clientY,y:innerWidth-e.clientX}:{x:e.clientX,y:e.clientY};}
function pickIds(x,y){
  ndc.set(x/APPW*2-1,-(y/APPH)*2+1);ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects([...INTER.values()],true);const ids=[];
  for(const h of hits){let o=h.object,id=null,vis=true;while(o){if(!o.visible)vis=false;if(o.userData.iid&&!id)id=o.userData.iid;o=o.parent;}
    if(id&&vis&&!ids.includes(id))ids.push(id);}
  return ids;
}
function screenOf(obj){const b=boundsOf(obj);const c=new V3();b.getCenter(c);c.project(camera);return{x:(c.x+1)/2*APPW,y:(1-c.y)/2*APPH,z:c.z};}
function pick(x,y){
  const ids=pickIds(x,y);const t=targetsOf(G.step);
  const hitT=ids.find(i=>t.includes(i));if(hitT)return hitT;
  const kn=ids.find(i=>i.startsWith('knob'));
  if(ids.length&&!kn)return ids[0];
  for(const id of t){const o=INTER.get(id);if(!o)continue;const s=screenOf(o);if(s.z<1&&Math.hypot(s.x-x,s.y-y)<64)return id;}
  return ids[0]||null;
}
const ptr={down:false,id:null,x:0,y:0,sx:0,sy:0,t:0,moved:0,stir:false,ang:null};
const cvs=renderer.domElement;
cvs.addEventListener('pointerdown',e=>{
  if(ptr.down)return;initAudio();if(AC&&AC.state==='suspended')AC.resume();
  const A=toApp(e);
  ptr.down=true;ptr.id=e.pointerId;ptr.x=ptr.sx=A.x;ptr.y=ptr.sy=A.y;ptr.t=performance.now();ptr.moved=0;ptr.stir=false;ptr.ang=null;
  try{cvs.setPointerCapture(e.pointerId);}catch(_){}
  const s=G.step;
  if(G.mode==='play'&&s&&(s.type==='stir'||s.type==='stircook')&&!G.busy){
    const C=CT[s.target];const sc=screenOf(C.group);const ids=pickIds(A.x,A.y);
    if(ids.includes(s.target)||Math.hypot(sc.x-A.x,sc.y-A.y)<Math.min(APPW,APPH)*.3){ptr.stir=true;ptr.c=sc;}
  }
});
cvs.addEventListener('pointermove',e=>{
  if(!ptr.down||e.pointerId!==ptr.id)return;
  const A=toApp(e);
  const dx=A.x-ptr.x,dy=A.y-ptr.y;ptr.x=A.x;ptr.y=A.y;ptr.moved+=Math.abs(dx)+Math.abs(dy);
  if(ptr.stir){
    const vx=A.x-ptr.c.x,vy=A.y-ptr.c.y;const d=Math.hypot(vx,vy);
    let inc=0;if(d>18){const a=Math.atan2(vy,vx);if(ptr.ang!==null){let da=a-ptr.ang;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;inc=Math.abs(da);G.spoonAng=(G.spoonAng||0)+da;}ptr.ang=a;}
    else inc=Math.hypot(dx,dy)/120;
    inc=Math.min(inc,.6);
    if(inc>.01){G.lastStir=G.time;if(G.step&&G.step.type==='stir')G.ss.amt+=inc;if(Math.random()<inc*.6)SFX.stir();}
    return;
  }
  if(ptr.moved>8){G.yaw+=dx*.0048;G.pitch=clamp(G.pitch-dy*.0048,-1.3,.6);G.manualUntil=performance.now()+2600;}
});
function endPtr(e){
  if(!ptr.down||e.pointerId!==ptr.id)return;ptr.down=false;
  const dt=performance.now()-ptr.t;
  if(ptr.moved<10&&dt<600&&!(ptr.stir&&ptr.moved>4)){
    if(G.mode==='play'){const A=toApp(e);onTap(pick(A.x,A.y));}
  }

  app.style.transform=ROT?`translate(${W}px,0) rotate(90deg)`:'none';
  renderer.setSize(APPW,APPH,false);camera.aspect=APPW/APPH;
  camera.fov=APPW/APPH>1.9?52:58;camera.position.set(.12,1.6,.44);camera.updateProjectionMatrix();

function updateCamera(dt){
  if(G.mode==='menu'){const t=G.time*.12;G.focus.set(-.3+Math.sin(t)*.65,.95+Math.sin(t*1.3)*.08,-.65);}
  if(performance.now()>G.manualUntil||G.mode==='menu'){
    const d=G.focus.clone().sub(camera.position);let ty=Math.atan2(d.x,-d.z),tp=Math.atan2(d.y,Math.hypot(d.x,d.z));
    if(G.mode==='play')tp+=.05;
    const k=1-Math.exp(-dt*(G.mode==='menu'?1.2:3.2));G.yaw+=(ty-G.yaw)*k;G.pitch+=(tp-G.pitch)*k;
  }
  G.yaw=clamp(G.yaw,-1.45,1.45);G.pitch=clamp(G.pitch,-1.3,.6);
  const f=new V3(Math.sin(G.yaw)*Math.cos(G.pitch),Math.sin(G.pitch),-Math.cos(G.yaw)*Math.cos(G.pitch));
  camera.lookAt(camera.position.clone().add(f));
}

  const o=INTER.get(t);if(!o){marker.visible=false;return;}
  const b=boundsOf(o);const c=new V3();b.getCenter(c);
  marker.visible=true;marker.position.set(c.x,b.max.y+.05+Math.sin(G.time*5)*.012,c.z);const s=.055+Math.sin(G.time*5)*.004;marker.scale.set(s,s,1);
  if(G.lastTarget!==t){G.lastTarget=t;focusOn(c);}
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;G.time+=dt;
  updateTweens(dt);
  stepUpdate(dt);
  if(G.rod)rodUpdate(dt);
  if(CH.visible){const f=.9+Math.sin(G.time*7)*.08+Math.random()*.12;CH.userData.coal.material.emissiveIntensity=f*1.1;CH.userData.lumps[1].emissiveIntensity=.4+Math.random()*.4;grillLight.intensity=1.5*f;}
  for(const C of Object.values(CT))C.update(dt);
  // flames + burner light
  let active=-1,best=0;
  flames.forEach((fg,i)=>{const l=G.burners[i];if(!l)return;const s=[0,.55,.85,1.2][l];fg.children.forEach(pv=>{const c=pv.children[0];c.scale.set(1,s*(.82+Math.random()*.36),1);});if(l>best){best=l;active=i;}});
  if(active>=0){burnerLight.position.set(BURNERS[active][0],.96,BURNERS[active][1]);burnerLight.intensity=best*.45*(.9+Math.random()*.2);}else burnerLight.intensity=0;
  if(G.oven)ovenLight.intensity=1.3+Math.sin(G.time*3)*.08;
  // steam, bubbles, sizzle
  let sizzle=0;
  for(const C of Object.values(CT)){
    const hf=C.burner>=0?heatF(G.burners[C.burner]):0;
    const auto=C.shown>.01?hf*.3:0;const rate=(C.steam+auto)*14;
    if(Math.random()<rate*dt){const p=C.center();const rr=lerp(C.r,C.rt,C.shown)*.6;p.x+=rnd(-rr,rr);p.z+=rnd(-rr,rr);emit(p,{});}
    if(C.boil>0&&C.shown>.01&&Math.random()<C.boil*26*dt){const p=C.center();const rr=lerp(C.r,C.rt,C.shown)*.8;const a=Math.random()*TAU,r=Math.sqrt(Math.random())*rr;p.x+=Math.cos(a)*r;p.z+=Math.sin(a)*r;bubble(p,C.disp);if(G.time-(G.lastPop||0)>.09&&Math.random()<.5){G.lastPop=G.time;SFX.pop();}}
    sizzle=Math.max(sizzle,hf*(C.shown>.01?.6+C.boil*.4:.25));
  }
  if(G.oven)sizzle=Math.max(sizzle,.25);
  if(G.rod)sizzle=Math.max(sizzle,.35+G.rod.slots.filter(Boolean).length*.25);
  if(sizzleGain)sizzleGain.gain.value=lerp(sizzleGain.gain.value,(G.mode==='play'?sizzle:0)*.05*(.8+Math.random()*.4),.2);
  updateParticles(dt);
  updateMarker();
  updateCamera(dt);
  renderer.render(scene,camera);
}

(async function boot(){
  try{await Promise.race([Promise.all([document.fonts.load('800 40px "Baloo 2"'),document.fonts.load('600 20px Figtree')]),sleep(2)]);}catch(e){}
  buildTextures();buildEnv();buildKitchen();buildParticles();registerStatic();resize();
  showMenu();refreshAudioUI();
  $('#loading').hidden=true;
  requestAnimationFrame(frame);
})();
</script>
